<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Razorpay Agent · ACP on Razorpay</title>
  <meta name="description" content="An agentic-commerce node speaking ACP 2.0 + AP2 mandates on Razorpay rails, backed by a tamper-evident audit chain." />

  <!-- No-FOUC theme boot: set data-theme before first paint. -->
  <script>
    (function () {
      try {
        // Light opens by default; dark is an explicit, persisted opt-in.
        var t = localStorage.getItem('acp-theme');
        if (t !== 'dark' && t !== 'light') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
/* ============================================================================
   dashboard.css — Razorpay Agent console
   A design-token system (light default + full dark) for a modern AI-commerce
   product: a chat-hero surface with a slide-over Trust Center. Razorpay blue +
   emerald, IBM Plex, transform/opacity motion, reduced-motion respected.

   Fonts are loaded via <link> in dashboard.html; the initial data-theme is set
   by an inline boot script before first paint (no FOUC).
   ============================================================================ */

:root {
  color-scheme: light;

  /* Surfaces & text */
  --canvas: #FBFCFE;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E9EEF6;
  --border: #E2E8F0;
  --border-strong: #CBD5E1;
  --text: #0F172A;
  --text-2: #475569;
  --text-3: #94A3B8;

  /* Brand + semantic */
  --primary: #3B82F6;
  --primary-strong: #2563EB;
  --trust: #059669;
  --pending: #D97706;
  --broken: #DC2626;
  --neutral: #64748B;

  /* Translucent fills for badges / nodes */
  --primary-weak: color-mix(in srgb, var(--primary) 12%, transparent);
  --trust-weak: color-mix(in srgb, var(--trust) 13%, transparent);
  --pending-weak: color-mix(in srgb, var(--pending) 14%, transparent);
  --broken-weak: color-mix(in srgb, var(--broken) 13%, transparent);
  --neutral-weak: color-mix(in srgb, var(--neutral) 13%, transparent);

  /* JSON syntax (theme-aware) */
  --json-key: #0F766E;
  --json-string: #B45309;
  --json-number: #1D4ED8;
  --json-bool: #7C3AED;
  --json-null: #64748B;
  --json-punct: #94A3B8;

  /* Shape / depth / motion / type */
  --radius-lg: 22px;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-1: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .05);
  --shadow-2: 0 18px 44px -14px rgba(15, 23, 42, .22), 0 6px 16px -8px rgba(15, 23, 42, .12);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #0A0F1A;
  --surface: #0F1626;
  --surface-2: #151D2E;
  --surface-3: #1B2436;
  --border: #1E293B;
  --border-strong: #2C3B52;
  --text: #E6EAF2;
  --text-2: #94A3B8;
  --text-3: #64748B;

  --primary: #5B9CFF;
  --primary-strong: #7DB0FF;
  --trust: #34D399;
  --pending: #FBBF24;
  --broken: #F87171;
  --neutral: #64748B;

  --primary-weak: color-mix(in srgb, var(--primary) 18%, transparent);
  --trust-weak: color-mix(in srgb, var(--trust) 16%, transparent);
  --pending-weak: color-mix(in srgb, var(--pending) 18%, transparent);
  --broken-weak: color-mix(in srgb, var(--broken) 18%, transparent);
  --neutral-weak: color-mix(in srgb, var(--neutral) 20%, transparent);

  --json-key: #5EEAD4;
  --json-string: #FCD34D;
  --json-number: #7DD3FC;
  --json-bool: #C4B5FD;
  --json-null: #64748B;
  --json-punct: #475569;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow-2: 0 24px 56px -18px rgba(0, 0, 0, .7), 0 8px 20px -10px rgba(0, 0, 0, .5);
}

/* Tone utility: sets --tone / --tone-weak for nodes, badges, accents. */
.tone-trust   { --tone: var(--trust);   --tone-weak: var(--trust-weak); }
.tone-pending { --tone: var(--pending); --tone-weak: var(--pending-weak); }
.tone-broken  { --tone: var(--broken);  --tone-weak: var(--broken-weak); }
.tone-info    { --tone: var(--primary); --tone-weak: var(--primary-weak); }
.tone-neutral { --tone: var(--neutral); --tone-weak: var(--neutral-weak); }

*, *::before, *::after { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; }

body {
  font-family: var(--font-sans);
  background: var(--canvas);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* Cross-fade all themed properties on toggle (added/removed by theme.js). */
.theme-animating,
.theme-animating * {
  transition: background-color .3s var(--ease), color .3s var(--ease), border-color .3s var(--ease) !important;
}

.mono { font-family: var(--font-mono); }
svg { display: block; }
button { font: inherit; }

/* ── App shell ─────────────────────────────────────────────────────────── */
.app {
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 600px at 80% -10%, color-mix(in srgb, var(--primary) 8%, transparent), transparent 60%),
    radial-gradient(1000px 500px at -10% 0%, color-mix(in srgb, var(--trust) 7%, transparent), transparent 55%);
}

.topbar {
  flex-shrink: 0;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  backdrop-filter: saturate(140%) blur(12px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 38px; height: 38px;
  border-radius: 11px;
  display: grid; place-items: center;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--primary-strong));
  box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--primary) 70%, transparent);
}
.brand-mark svg { width: 20px; height: 20px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
.brand-sub { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }

.topbar-actions { display: flex; align-items: center; gap: 10px; }

.btn {
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 600;
  border-radius: 11px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  transition: transform .15s var(--ease), background .2s var(--ease), border-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
}
.btn:hover { color: var(--text); border-color: var(--text-3); box-shadow: var(--shadow-1); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.btn-trust { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; }
.btn-trust svg { width: 17px; height: 17px; color: var(--trust); }

.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }

/* ── Chat stage ────────────────────────────────────────────────────────── */
.stage {
  flex: 1;
  display: flex;
  justify-content: center;
  overflow: hidden;
  padding: 0 20px;
}
.chat-region {
  width: 100%;
  max-width: 840px;
  height: 100%;
  display: flex;
  flex-direction: column;
}
.chat-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 30px 6px 14px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  scroll-behavior: smooth;
}
.chat-scroll::-webkit-scrollbar { width: 10px; }
.chat-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

/* Empty-state hero */
.hero {
  margin: auto 0;
  padding: 24px 8px 8px;
  text-align: center;
  animation: rise .5s var(--ease) both;
  transition: opacity .25s var(--ease), transform .25s var(--ease);
}
.hero.is-gone { opacity: 0; transform: translateY(-8px); }
.hero-badge {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 13px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-size: 12.5px; font-weight: 600;
  box-shadow: var(--shadow-1);
}
.hero-badge svg { width: 15px; height: 15px; color: var(--trust); }
.hero-title {
  margin: 22px 0 10px;
  font-size: clamp(26px, 4.5vw, 38px);
  font-weight: 700;
  letter-spacing: -0.025em;
  line-height: 1.1;
  background: linear-gradient(135deg, var(--text), color-mix(in srgb, var(--text) 55%, var(--primary)));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero-sub {
  max-width: 560px;
  margin: 0 auto 26px;
  color: var(--text-2);
  font-size: 15px;
  line-height: 1.6;
}
.hero-chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.hero-chip {
  font-family: inherit; font-size: 13.5px; font-weight: 500;
  padding: 10px 15px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  box-shadow: var(--shadow-1);
  transition: transform .15s var(--ease), border-color .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease);
}
.hero-chip:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
  color: var(--text);
  box-shadow: 0 10px 24px -12px color-mix(in srgb, var(--primary) 60%, transparent);
}
.hero-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ── Messages ──────────────────────────────────────────────────────────── */
.msg { display: flex; }
.msg-user { justify-content: flex-end; }
.msg-agent { flex-direction: column; align-items: flex-start; }

.bubble {
  max-width: 78%;
  padding: 12px 16px;
  border-radius: 18px;
  box-shadow: var(--shadow-1);
  animation: rise .3s var(--ease) both;
}
.bubble-user {
  background: linear-gradient(135deg, var(--primary), var(--primary-strong));
  color: #fff;
  border-bottom-right-radius: 6px;
}
.bubble-agent {
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom-left-radius: 6px;
}
.bubble-text { white-space: pre-wrap; line-height: 1.55; font-size: 14.5px; }
.bubble-time { margin-top: 6px; font-size: 11px; opacity: .55; text-align: right; font-family: var(--font-mono); }
.bubble-user .bubble-time { color: #fff; opacity: .75; }

/* ── Inline "thinking" disclosure ──────────────────────────────────────── */
.think { align-self: flex-start; max-width: 90%; animation: rise .3s var(--ease) both; }
.think-head {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: inherit; font-size: 13px; font-weight: 500;
  padding: 8px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  transition: border-color .2s var(--ease), color .2s var(--ease), background .2s var(--ease);
}
.think.is-live .think-head { cursor: default; }
.think-head:hover { color: var(--text); border-color: var(--border-strong); }
.think-spark { display: grid; place-items: center; color: var(--primary); }
.think-spark svg { width: 15px; height: 15px; }
.think.is-live .think-spark { animation: spin 3s linear infinite; }
.think-headline { font-weight: 600; color: var(--text); }
.think-mid { color: var(--text-3); }
.think-outcome { color: var(--tone); font-weight: 600; }
.think-chev { margin-left: 2px; color: var(--text-3); transition: transform .3s var(--ease); }
.think-chev svg { width: 15px; height: 15px; }
.think[data-open="true"] .think-chev { transform: rotate(180deg); }

.think-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .32s var(--ease); }
.think[data-open="true"] .think-body { grid-template-rows: 1fr; }
.think-body-inner { overflow: hidden; min-height: 0; }

.think-steps { list-style: none; margin: 8px 0 0; padding: 6px 0 2px 4px; }
.think-step {
  position: relative;
  display: flex; align-items: flex-start; gap: 12px;
  padding: 7px 0;
}
.think-step::before {
  content: ""; position: absolute;
  left: 12px; top: 30px; bottom: -7px; width: 2px;
  background: var(--border);
}
.think-step:last-child::before { display: none; }
.think[data-open="true"] .think-step { animation: stepIn .34s var(--ease) both; animation-delay: calc(var(--i) * 45ms); }
.think-node {
  width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; flex-shrink: 0;
  background: var(--tone-weak); color: var(--tone);
  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);
  z-index: 1;
}
.think-node svg { width: 14px; height: 14px; }
.think-step-body { display: flex; flex-direction: column; gap: 1px; padding-top: 3px; }
.think-step-title { font-size: 13.5px; color: var(--text); font-weight: 500; }
.think-step-detail { font-size: 12px; color: var(--text-2); }
.think-step-time { margin-left: auto; font-size: 11px; color: var(--text-3); padding-top: 5px; }

/* ── Receipt card ──────────────────────────────────────────────────────── */
.receipt {
  width: 100%; max-width: 400px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  overflow: hidden;
  animation: rise .34s var(--ease) both;
}
.receipt-perf {
  height: 8px;
  background: radial-gradient(circle at 6px 8px, transparent 0 5px, var(--surface) 5px) repeat-x;
  background-size: 14px 8px;
  background-position: 0 -4px;
  border-bottom: 1px dashed var(--border);
}
.receipt-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 16px 18px 12px;
}
.receipt-merchant-name { font-weight: 700; font-size: 15px; }
.receipt-order { font-size: 12px; color: var(--text-3); font-family: var(--font-mono); margin-top: 2px; }
.receipt-status {
  flex-shrink: 0;
  padding: 5px 11px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700;
  background: var(--tone-weak); color: var(--tone);
  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);
}
.receipt-lines { padding: 4px 18px 0; }
.receipt-line { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; font-size: 14px; }
.receipt-line-name { color: var(--text); }
.receipt-leader { flex: 1; border-bottom: 1.5px dotted var(--border-strong); transform: translateY(-3px); }
.receipt-line-price { font-family: var(--font-mono); color: var(--text-2); }
.receipt-totals { padding: 10px 18px 4px; border-top: 1px solid var(--border); margin-top: 8px; }
.receipt-trow { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13.5px; color: var(--text-2); }
.receipt-trow .mono { color: var(--text-2); }
.receipt-trow.is-total { font-size: 16px; font-weight: 700; color: var(--text); padding-top: 8px; }
.receipt-trow.is-total .mono { color: var(--text); }
.receipt-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 18px 16px;
}
.chain-chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 12px; font-weight: 500;
  padding: 6px 11px; border-radius: 999px;
  background: var(--trust-weak); color: var(--trust);
  border: 1px solid color-mix(in srgb, var(--trust) 28%, transparent);
  cursor: pointer;
  transition: transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
}
.chain-chip:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--trust) 70%, transparent); }
.chain-chip:focus-visible { outline: 2px solid var(--trust); outline-offset: 2px; }
.chain-chip-check { display: grid; place-items: center; }
.chain-chip-check svg { width: 13px; height: 13px; }
.receipt-time { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }

/* ── Composer ──────────────────────────────────────────────────────────── */
.composer { flex-shrink: 0; padding: 10px 6px 20px; }
.composer-box {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  padding: 12px 14px 10px;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.composer-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px var(--primary-weak), var(--shadow-2);
}
.composer.is-locked .composer-box { opacity: .7; }
.composer-input {
  width: 100%;
  border: none; outline: none; resize: none;
  background: transparent;
  color: var(--text);
  font-family: inherit; font-size: 15px; line-height: 1.5;
  max-height: 200px;
}
.composer-input::placeholder { color: var(--text-3); }
.composer-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.composer-budget {
  display: inline-flex; align-items: center; gap: 2px;
  padding: 6px 10px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); font-size: 13px; font-weight: 600;
}
.composer-budget-sym { color: var(--text-3); }
.composer-budget-input {
  width: 66px; border: none; outline: none; background: transparent;
  color: var(--text); font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  -moz-appearance: textfield;
}
.composer-budget-input::-webkit-outer-spin-button,
.composer-budget-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.composer-model { display: inline-flex; }
.composer-model-select {
  font-family: inherit; font-size: 13px; font-weight: 600;
  padding: 7px 10px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); cursor: pointer;
}
.composer-model-select:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.composer-spacer { flex: 1; }
.composer-send {
  width: 40px; height: 40px; flex-shrink: 0;
  display: grid; place-items: center;
  border: none; border-radius: 12px; cursor: pointer;
  color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--primary-strong));
  box-shadow: 0 8px 18px -8px color-mix(in srgb, var(--primary) 75%, transparent);
  transition: transform .15s var(--ease), box-shadow .2s var(--ease), opacity .2s var(--ease);
}
.composer-send svg { width: 18px; height: 18px; }
.composer-send:hover { transform: translateY(-1px) scale(1.03); }
.composer-send:active { transform: translateY(0) scale(.97); }
.composer-send:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.composer-hint { margin: 9px 4px 0; font-size: 11.5px; color: var(--text-3); text-align: center; }

/* ── Trust Center drawer ───────────────────────────────────────────────── */
.trust-backdrop {
  position: fixed; inset: 0;
  background: rgba(2, 6, 23, .42);
  opacity: 0; transition: opacity .32s var(--ease);
  z-index: 40;
}
.trust-backdrop.is-open { opacity: 1; }

.trust-drawer {
  position: fixed; top: 0; right: 0;
  height: 100vh; height: 100dvh;
  width: min(468px, 94vw);
  background: var(--surface);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-2);
  transform: translateX(100%);
  transition: transform .36s var(--ease);
  z-index: 50;
  display: flex; flex-direction: column;
}
.trust-drawer.is-open { transform: translateX(0); }
body.drawer-open { overflow: hidden; }

.drawer-head {
  flex-shrink: 0;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--border);
}
.drawer-eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--trust);
}
.drawer-eyebrow svg { width: 15px; height: 15px; }
.drawer-title { margin: 8px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.drawer-conn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 8px;
  font-size: 11.5px; font-weight: 600; font-family: var(--font-mono);
  padding: 3px 9px; border-radius: 999px;
}
.drawer-conn .conn-dot { width: 7px; height: 7px; border-radius: 50%; }
.drawer-conn.is-live { color: var(--trust); background: var(--trust-weak); }
.drawer-conn.is-live .conn-dot { background: var(--trust); box-shadow: 0 0 0 3px color-mix(in srgb, var(--trust) 25%, transparent); }
.drawer-conn.is-demo { color: var(--pending); background: var(--pending-weak); }
.drawer-conn.is-demo .conn-dot { background: var(--pending); }
.drawer-close {
  flex-shrink: 0;
  width: 36px; height: 36px; display: grid; place-items: center;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface); color: var(--text-2); cursor: pointer;
  transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
}
.drawer-close:hover { background: var(--surface-2); color: var(--text); }
.drawer-close svg { width: 18px; height: 18px; }

.drawer-scroll { flex: 1; overflow-y: auto; padding: 8px 20px 28px; }
.drawer-scroll::-webkit-scrollbar { width: 10px; }
.drawer-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }

.tc-section { padding: 18px 0; border-bottom: 1px solid var(--border); }
.tc-section:last-child { border-bottom: none; }
.tc-section-head {
  display: flex; align-items: center; gap: 9px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 14px;
}
.tc-section-icon { display: grid; place-items: center; color: var(--text-3); }
.tc-section-icon svg { width: 16px; height: 16px; }

/* Integrity */
.integrity-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; }
.integrity-status { display: flex; align-items: center; gap: 12px; color: var(--tone, var(--text-2)); }
.integrity-status svg { width: 26px; height: 26px; flex-shrink: 0; }
.integrity-status b { display: block; font-size: 15px; color: var(--text); }
.integrity-status small { display: block; font-size: 12px; color: var(--text-2); margin-top: 1px; }
.verify-btn {
  width: 100%; margin-top: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  font-family: inherit; font-size: 14px; font-weight: 600;
  padding: 11px 14px; border-radius: 11px; cursor: pointer;
  border: 1px solid transparent; color: #fff;
  background: linear-gradient(135deg, var(--primary), var(--primary-strong));
  box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--primary) 70%, transparent);
  transition: transform .15s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
}
.verify-btn:hover { transform: translateY(-1px); filter: brightness(1.03); }
.verify-btn:active { transform: translateY(0); }
.verify-btn svg { width: 18px; height: 18px; }
.verify-btn.state-verifying { background: var(--surface-3); color: var(--text-2); box-shadow: none; cursor: progress; }
.verify-btn.state-valid { background: linear-gradient(135deg, var(--trust), color-mix(in srgb, var(--trust) 70%, #000)); box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--trust) 70%, transparent); }
.verify-btn.state-invalid { background: linear-gradient(135deg, var(--broken), color-mix(in srgb, var(--broken) 72%, #000)); box-shadow: 0 8px 18px -10px color-mix(in srgb, var(--broken) 70%, transparent); }
.verify-status { margin: 10px 2px 0; font-size: 12px; color: var(--text-3); font-family: var(--font-mono); }

.tamper-toggle { display: flex; align-items: center; gap: 9px; margin-top: 14px; cursor: pointer; user-select: none; }
.tamper-toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
.tamper-track {
  position: relative; width: 38px; height: 22px; flex-shrink: 0;
  border-radius: 999px; background: var(--border-strong);
  transition: background .2s var(--ease);
}
.tamper-thumb {
  position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .22s var(--ease);
}
.tamper-toggle input:checked + .tamper-track { background: var(--broken); }
.tamper-toggle input:checked + .tamper-track .tamper-thumb { transform: translateX(16px); }
.tamper-toggle input:focus-visible + .tamper-track { outline: 2px solid var(--primary); outline-offset: 2px; }
.tamper-text { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); }
.tamper-text svg { width: 15px; height: 15px; }

/* Mandate */
.meter-labels { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); margin-bottom: 7px; }
.meter-text { color: var(--text); font-weight: 600; }
.meter-track { height: 9px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter-fill { height: 100%; width: 0%; border-radius: 999px; background: var(--trust); transition: width .4s var(--ease), background .3s var(--ease); }
.expiry-row { display: flex; align-items: center; gap: 10px; margin: 16px 0; font-size: 13.5px; }
.expiry-label { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); }
.expiry-label svg { width: 15px; height: 15px; }
.expiry-time { font-weight: 700; }

/* JSON viewer */
.json-viewer {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px;
  overflow-x: auto; max-height: 340px; overflow-y: auto;
  color: var(--json-punct);
}
.json-viewer ul { list-style: none; margin: 0; padding-left: 16px; border-left: 1px solid var(--border); }
.json-viewer > ul { padding-left: 0; border-left: none; }
.json-key { color: var(--json-key); }
.json-string { color: var(--json-string); word-break: break-all; }
.json-number { color: var(--json-number); }
.json-boolean { color: var(--json-bool); }
.json-null { color: var(--json-null); }
.json-empty { color: var(--text-3); }

/* Activity */
.activity-list { list-style: none; margin: 0; padding: 2px 0 0 2px; }
.tc-empty { color: var(--text-3); font-size: 13px; padding: 6px 0; }
.activity-item {
  position: relative;
  display: flex; align-items: flex-start; gap: 12px;
  padding: 9px 0;
}
.activity-item::before {
  content: ""; position: absolute;
  left: 13px; top: 34px; bottom: -9px; width: 2px; background: var(--border);
}
.activity-item:last-child::before { display: none; }
.activity-item.enter { animation: activityIn .4s var(--ease) both; }
.activity-node {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  background: var(--tone-weak); color: var(--tone);
  border: 1px solid color-mix(in srgb, var(--tone) 30%, transparent);
  z-index: 1;
}
.activity-node svg { width: 15px; height: 15px; }
.activity-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 2px; }
.activity-title { font-size: 13.5px; font-weight: 500; color: var(--text); }
.activity-meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-3); }
.activity-meta .mono { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-time { white-space: nowrap; }
.activity-amount { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--text); padding-top: 3px; }

/* Hash chain */
.chain-list { list-style: none; margin: 0; padding: 0; }
.chain-item { display: flex; flex-direction: column; }
.chain-connector { display: flex; flex-direction: column; align-items: center; color: var(--text-3); padding: 2px 0; }
.chain-connector svg { width: 15px; height: 15px; }
.chain-line { width: 2px; height: 12px; background: currentColor; opacity: .4; }
.chain-connector.tone-ok { color: var(--trust); }
.chain-connector.tone-broken { color: var(--broken); }
.chain-connector.tone-suspect { color: var(--pending); }
.chain-block {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px 14px;
  transition: border-color .25s var(--ease), background .25s var(--ease), box-shadow .3s var(--ease);
}
.chain-block.tone-ok { border-color: color-mix(in srgb, var(--trust) 40%, var(--border)); }
.chain-block.tone-broken { border-color: var(--broken); background: var(--broken-weak); }
.chain-block.tone-suspect { border-color: color-mix(in srgb, var(--pending) 45%, var(--border)); }
.chain-block.pulse { animation: pulseGlow 1.6s var(--ease); }
.chain-block-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chain-seq { font-size: 12px; color: var(--text-3); }
.chain-event { font-size: 12.5px; font-weight: 700; letter-spacing: .02em; color: var(--text); }
.chain-block-time { margin-left: auto; font-size: 11px; color: var(--text-3); }
.chain-flag {
  font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
  padding: 2px 7px; border-radius: 6px;
  background: var(--broken-weak); color: var(--broken);
}
.chain-hashes { display: flex; flex-direction: column; gap: 3px; margin-top: 9px; font-size: 12px; }
.chain-hash-row { color: var(--text-3); }
.hash-val { color: var(--text-2); }
.hash-val.is-hash { color: var(--primary); }
.hash-val.is-prev { color: var(--text-3); }
.hash-val.is-bad { color: var(--broken); font-weight: 600; }
.chain-toggle {
  margin-top: 9px; padding: 0; border: none; background: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 12px; color: var(--text-3);
  transition: color .2s var(--ease);
}
.chain-toggle:hover { color: var(--primary); }
.chain-payload { margin-top: 8px; }
.chain-payload .json-viewer { background: var(--surface); }

/* Spinner */
.spin { animation: spin 1s linear infinite; }

/* ── Keyframes ─────────────────────────────────────────────────────────── */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes stepIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes activityIn { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulseGlow {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 55%, transparent); }
  100% { box-shadow: 0 0 0 14px transparent; }
}
@keyframes shimmer { to { background-position: -200% 0; } }
.shimmer {
  background: linear-gradient(90deg, var(--text-3) 0%, var(--text) 50%, var(--text-3) 100%);
  background-size: 200% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 1.5s linear infinite;
}

/* ── Responsive ────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  .topbar { padding: 0 14px; }
  .brand-sub { display: none; }
  .btn-trust span { display: none; }
  .btn-trust { padding: 9px; }
  .stage { padding: 0 10px; }
  .bubble { max-width: 88%; }
}

/* ── Reduced motion ────────────────────────────────────────────────────── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
    scroll-behavior: auto !important;
  }
  .think.is-live .think-spark { animation: none; }
  .shimmer { animation: none; color: var(--text-2); }
}

</style>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 2 4.5 12.5H11l-1 9.5L19.5 11H13l0-9Z" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Agentic&nbsp;Commerce</span>
          <span class="brand-sub">ACP 2.0 · AP2 · Razorpay rails</span>
        </span>
      </div>

      <div class="topbar-actions">
        <button id="trust-btn" class="btn btn-trust" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Trust Center</span>
        </button>
        <button id="theme-toggle" class="btn icon-btn" type="button" aria-label="Toggle theme"></button>
      </div>
    </header>

    <main class="stage">
      <div id="chat-region" class="chat-region"></div>
    </main>
  </div>

  <!-- Trust Center slide-over -->
  <div id="trust-backdrop" class="trust-backdrop" hidden></div>
  <aside id="trust-drawer" class="trust-drawer" role="dialog" aria-modal="true" aria-labelledby="trust-title" aria-hidden="true"></aside>

  <script>
/**
 * store.js — AuditStore: the single source of truth for the hash-chained audit
 * trail on the client.
 *
 * Both the chat panel (to build each turn's "thinking" trace) and the Trust
 * Center drawer (mandate + activity + hash chain) read from here, so the log is
 * polled ONCE, not once per panel (previously inspector.js and hashchain.js each
 * polled /audit-log independently).
 *
 * It also owns every audit-derived helper the two panels share — money math,
 * id/label extraction, and human narration — plus a faithful offline demo chain
 * (same entry shape as src/lib/auditLog.js) so the whole UI is viewable as a
 * static file when the server isn't reachable (the sandbox blocks sockets).
 *
 * No framework, no bundler: a plain IIFE that attaches window.AuditStore.
 */
(function () {
  'use strict';

  var GENESIS_PREV_HASH = '0'.repeat(64);

  // The transaction-relevant subset the Activity timeline narrates. Raw genesis
  // and low-level state transitions still appear in the Hash Chain view.
  var FEED_TYPES = new Set([
    'AGENT_REASONING',
    'TOOL_CALL',
    'MANDATE_ISSUED',
    'MANDATE_VERIFIED',
    'GUARDRAIL_DECISION',
    'MONEY_ACTION',
    'WEBHOOK_RECEIVED',
    'FAILURE',
  ]);

  // ─── Formatting ──────────────────────────────────────────────────────────
  function formatPaise(paise) {
    return '₹' + (paise / 100).toLocaleString('en-IN', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    });
  }

  function formatRupees(rupees) {
    return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' })
      .format(rupees || 0);
  }

  function truncateHash(hash) {
    if (!hash) return '';
    if (hash === 'GENESIS') return hash;
    if (hash.length <= 14) return hash;
    return hash.slice(0, 8) + '…' + hash.slice(-4);
  }

  // ─── Money / id extraction (ported from inspector.js) ────────────────────
  // MONEY_ACTION payloads vary by source (stub /chat uses amount_rupees; the
  // checkout/orders taps use amount_paise), so accept either.
  function amountPaiseOf(payload) {
    if (!payload || typeof payload !== 'object') return null;
    if (typeof payload.amount_paise === 'number') return payload.amount_paise;
    if (typeof payload.amount_rupees === 'number') return Math.round(payload.amount_rupees * 100);
    return null;
  }

  function idOf(entry) {
    var p = entry.payload || {};
    return (
      p.order_id || p.razorpay_order_id || p.receipt || p.payment_link_id ||
      p.id || entry.session_id || entry.entry_id || ''
    );
  }

  // ─── View mapping: an entry → { label, tone, amountPaise } ────────────────
  // tone ∈ trust | pending | broken | info | neutral (drives the CSS accent).
  function feedView(entry) {
    var p = entry.payload || {};
    switch (entry.event_type) {
      case 'AGENT_REASONING':
        return { label: 'agent.' + (p.step || 'reasoning'), tone: 'neutral', amountPaise: null };
      case 'TOOL_CALL': {
        var out = p.output && typeof p.output === 'object' ? p.output : null;
        var ap = out && typeof out.amount_total_rupees === 'number'
          ? Math.round(out.amount_total_rupees * 100)
          : amountPaiseOf(out);
        return { label: 'tool.' + (p.tool || 'call'), tone: p.error ? 'broken' : 'info', amountPaise: ap };
      }
      case 'MONEY_ACTION':
        return { label: p.action || p.status || 'money.action', tone: 'trust', amountPaise: amountPaiseOf(p) };
      case 'GUARDRAIL_DECISION': {
        var escalated = p.decision === 'ESCALATE_TO_HUMAN' || p.outcome === 'FAIL';
        var gl = 'guardrail.' + String(p.decision || p.outcome || 'decision').toLowerCase();
        return { label: gl, tone: escalated ? 'pending' : 'trust', amountPaise: amountPaiseOf(p) };
      }
      case 'MANDATE_ISSUED':
        return { label: 'mandate.issued', tone: 'info', amountPaise: null };
      case 'MANDATE_VERIFIED':
        return { label: 'mandate.verified', tone: 'trust', amountPaise: null };
      case 'WEBHOOK_RECEIVED': {
        var ev = String(p.event || 'webhook');
        return { label: ev, tone: /fail|declin/i.test(ev) ? 'broken' : 'trust', amountPaise: amountPaiseOf(p) };
      }
      case 'FAILURE':
        return { label: 'failure', tone: 'broken', amountPaise: amountPaiseOf(p) };
      case 'GENESIS':
        return { label: 'genesis', tone: 'neutral', amountPaise: null };
      default:
        return { label: String(entry.event_type || 'event').toLowerCase(), tone: 'neutral', amountPaise: amountPaiseOf(p) };
    }
  }

  // ─── Human narration: an entry → { title, detail, tone, icon } ────────────
  // Used by the inline "thinking" timeline (chat) and the Activity feed (drawer).
  function narrate(entry) {
    var p = entry.payload || {};
    var money = amountPaiseOf(p);
    var moneyStr = money != null ? formatPaise(money) : '';
    switch (entry.event_type) {
      case 'AGENT_REASONING':
        if (p.step === 'search_catalog') return { title: 'Searched the catalog', detail: p.note || '', tone: 'info', icon: 'search' };
        if (p.step === 'create_cart') {
          var t = typeof p.total === 'number' ? formatRupees(p.total) : '';
          return { title: 'Built the cart', detail: t, tone: 'info', icon: 'cart' };
        }
        return { title: 'Reasoned about your request', detail: p.user_message ? '“' + p.user_message + '”' : '', tone: 'neutral', icon: 'brain' };
      case 'TOOL_CALL':
        return { title: 'Called tool · ' + (p.tool || 'tool'), detail: moneyStr, tone: p.error ? 'broken' : 'info', icon: 'tool' };
      case 'MANDATE_ISSUED': {
        var m = p.mandate || {};
        var cap = typeof m.max_paise === 'number' ? formatPaise(m.max_paise) : '';
        return { title: 'Issued intent mandate', detail: cap ? 'cap ' + cap : '', tone: 'info', icon: 'shield' };
      }
      case 'MANDATE_VERIFIED':
        return { title: 'Verified mandate signature', detail: p.method && p.path ? p.method + ' ' + p.path : '', tone: 'trust', icon: 'shieldCheck' };
      case 'GUARDRAIL_DECISION': {
        var esc = p.decision === 'ESCALATE_TO_HUMAN' || p.outcome === 'FAIL';
        if (esc) return { title: 'Held for your approval', detail: moneyStr + (p.threshold_rupees ? ' · over ₹' + Number(p.threshold_rupees).toLocaleString('en-IN') : ''), tone: 'pending', icon: 'guardrail' };
        return { title: 'Guardrail approved', detail: moneyStr, tone: 'trust', icon: 'guardrail' };
      }
      case 'MONEY_ACTION':
        return { title: 'Placed the order', detail: moneyStr, tone: 'trust', icon: 'money' };
      case 'WEBHOOK_RECEIVED': {
        var ev = String(p.event || 'webhook');
        var failed = /fail|declin/i.test(ev);
        return { title: 'Razorpay · ' + ev, detail: moneyStr, tone: failed ? 'broken' : 'trust', icon: 'webhook' };
      }
      case 'FAILURE':
        return { title: 'Step failed', detail: p.reason || p.message || '', tone: 'broken', icon: 'alert' };
      case 'GENESIS':
        return { title: 'Audit chain genesis', detail: 'server boot anchor', tone: 'neutral', icon: 'anchor' };
      default:
        return { title: String(entry.event_type || 'event'), detail: '', tone: 'neutral', icon: 'dot' };
    }
  }

  // ─── Shared icon set (stroke-based, inherit currentColor) ─────────────────
  var ICONS = {
    brain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 4.5a2.5 2.5 0 0 0-2.5 2.5 2.5 2.5 0 0 0-1 4.8A2.5 2.5 0 0 0 7 16.5a2.5 2.5 0 0 0 2.5 2.5V4.5Z"/><path d="M14.5 4.5A2.5 2.5 0 0 1 17 7a2.5 2.5 0 0 1 1 4.8A2.5 2.5 0 0 1 17 16.5a2.5 2.5 0 0 1-2.5 2.5V4.5Z"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>',
    cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.2L21 8H6"/></svg>',
    shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
    shieldCheck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>',
    shieldAlert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>',
    shieldQuestion: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>',

    unlink: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7h2a5 5 0 0 1 4 8"/><path d="M9 17H7A5 5 0 0 1 3 9"/><path d="m8 12 3 3"/><path d="M2 2l20 20"/></svg>',

  };
  function icon(key) { return ICONS[key] || ICONS.dot; }

  // ─── Offline demo chain (mirrors src/lib/auditLog.js entry shape) ─────────
  // Deterministic pseudo-hex so hashes look real and prev-links are coherent.
  function seededHex(seed, len) {
    len = len || 64;
    var x = seed >>> 0;
    var out = '';
    var chars = '0123456789abcdef';
    while (out.length < len) {
      x = (x * 1103515245 + 12345) & 0x7fffffff;
      out += chars[x % 16];
    }
    return out;
  }

  var demoChain = null;
  function buildDemoChain() {
    var chain = [];
    var base = Date.now() - 7 * 60 * 1000;
    function push(seq, ev, actor, sessionId, payload) {
      var prev = chain[chain.length - 1];
      var entry = {
        seq: seq,
        entry_id: 'log_' + seededHex(seq * 7919 + 13, 16),
        timestamp: new Date(base + seq * 62 * 1000).toISOString(),
        session_id: sessionId,
        actor: actor,
        event_type: ev,
        payload: payload,
        prev_hash: prev ? prev.hash : GENESIS_PREV_HASH,
      };
      entry.hash = seededHex(seq * 104729 + 7, 64);
      chain.push(entry);
      return entry;
    }
    push(0, 'GENESIS', 'merchant_server', null, { note: 'audit chain genesis — demo mode' });
    var order = 'ORD-482913';
    push(1, 'MANDATE_ISSUED', 'buyer_agent', order, {
      mandate: {
        mandate_type: 'IntentMandate',
        intent_id: seededHex(31, 32),
        max_paise: 800000,
        allowed_categories: ['electronics', 'groceries', 'subscriptions'],
        created_at: new Date(base).toISOString(),
        expiry_timestamp: new Date(Date.now() + 17 * 60 * 1000).toISOString(),
      },
    });
    push(2, 'MONEY_ACTION', 'merchant_server', order, {
      order_id: order, status: 'confirmed', currency: 'INR', amount_rupees: 5310,
      items: [{ name: 'Wireless earbuds', price: 4500 }],
    });
    push(3, 'WEBHOOK_RECEIVED', 'razorpay', order, { event: 'payment.captured', amount_paise: 531000 });
    return chain;
  }

  // ─── The store ────────────────────────────────────────────────────────────
  var entries = [];
  var integrity = { valid: true, brokenAt: null };
  var connected = false;
  var offline = false;
  var subs = new Set();
  var pollTimer = null;

  function snapshot() {
    return { entries: entries.slice(), integrity: integrity, connected: connected, offline: offline };
  }
  function emit() {
    var snap = snapshot();
    subs.forEach(function (fn) { try { fn(snap); } catch (e) { /* isolate subscribers */ } });
  }

  async function poll() {
    try {
      var res = await fetch('/audit-log', { headers: { accept: 'application/json' } });
      if (!res.ok) throw new Error('audit-log HTTP ' + res.status);
      var data = await res.json();
      entries = Array.isArray(data.entries) ? data.entries : [];
      integrity = data.integrity || { valid: true, brokenAt: null };
      connected = true;
      offline = false;
    } catch (err) {
      // Static-file / server-down: serve the seeded demo chain so the UI is alive.
      offline = true;
      connected = false;
      if (!demoChain) demoChain = buildDemoChain();
      entries = demoChain.slice();
      integrity = { valid: true, brokenAt: null };
    }
    emit();
    return entries.slice();
  }

  // Offline chat appends its turn's blocks here so thinking + Trust reflect it.
  function appendDemo(partials) {
    if (!demoChain) demoChain = buildDemoChain();
    var list = Array.isArray(partials) ? partials : [partials];
    var last = null;
    list.forEach(function (p) {
      var prev = demoChain[demoChain.length - 1];
      var seq = demoChain.length;
      var entry = {
        seq: seq,
        entry_id: 'log_' + seededHex(seq * 7919 + 101, 16),
        timestamp: new Date().toISOString(),
        session_id: p.session_id === undefined ? null : p.session_id,
        actor: p.actor || 'merchant_server',
        event_type: p.event_type,
        payload: p.payload || {},
        prev_hash: prev ? prev.hash : GENESIS_PREV_HASH,
      };
      entry.hash = seededHex(seq * 104729 + 53, 64);
      demoChain.push(entry);
      last = entry;
    });
    entries = demoChain.slice();
    offline = true;
    connected = false;
    emit();
    return last;
  }

  async function verify() {
    if (offline) {
      integrity = { valid: true, brokenAt: null };
      return integrity;
    }
    try {
      var res = await fetch('/audit-log/verify', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
      });
      if (!res.ok) throw new Error('verify HTTP ' + res.status);
      var data = await res.json();
      integrity = { valid: !!data.valid, brokenAt: data.brokenAt == null ? null : data.brokenAt };
      return integrity;
    } catch (err) {
      integrity = { valid: true, brokenAt: null };
      return integrity;
    }
  }

  window.AuditStore = {
    start: function (pollMs) {
      if (pollTimer) return;
      poll();
      pollTimer = setInterval(poll, pollMs || 1500);
    },
    stop: function () { clearInterval(pollTimer); pollTimer = null; },
    refresh: poll,
    verify: verify,
    subscribe: function (fn) { subs.add(fn); fn(snapshot()); return function () { subs.delete(fn); }; },
    entries: function () { return entries.slice(); },
    integrity: function () { return integrity; },
    maxSeq: function () { return entries.reduce(function (m, e) { return e.seq > m ? e.seq : m; }, -1); },
    isOffline: function () { return offline; },
    appendDemo: appendDemo,
    // Shared helpers
    formatPaise: formatPaise,
    formatRupees: formatRupees,
    truncateHash: truncateHash,
    amountPaiseOf: amountPaiseOf,
    idOf: idOf,
    feedView: feedView,
    narrate: narrate,
    icon: icon,
    FEED_TYPES: FEED_TYPES,
    GENESIS_PREV_HASH: GENESIS_PREV_HASH,
  };
})();

  <script>
/**
 * theme.js — light/dark toggle wiring + persistence.
 *
 * The initial data-theme is set by an inline boot script in dashboard.html
 * (before first paint, so there's no flash) — light by default. This module
 * only owns the toggle button: reflecting the current theme, flipping it, and
 * persisting the choice (dark is an explicit, remembered opt-in).
 *
 * window.Theme.init(button) is called on DOMContentLoaded.
 */
(function () {
  'use strict';

  var STORAGE_KEY = 'acp-theme';

  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>';

  function current() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  function apply(theme, btn) {
    document.documentElement.setAttribute('data-theme', theme);
    if (btn) {
      // The button shows the theme you'd switch TO.
      btn.innerHTML = theme === 'dark' ? SUN : MOON;
      btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      btn.setAttribute('title', theme === 'dark' ? 'Light mode' : 'Dark mode');
    }
  }

  function persist(theme) {
    try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) { /* private mode: session-only */ }
  }

  window.Theme = {
    init: function (btn) {
      apply(current(), btn);

      if (btn) {
        btn.addEventListener('click', function () {
          var next = current() === 'dark' ? 'light' : 'dark';
          // Briefly enable a cross-fade on the root, then apply.
          document.documentElement.classList.add('theme-animating');
          apply(next, btn);
          persist(next);
          window.setTimeout(function () {
            document.documentElement.classList.remove('theme-animating');
          }, 320);
        });
      }
    },
    current: current,
  };
})();
