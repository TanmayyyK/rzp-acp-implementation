  <script>
/**
 * chat.js — the hero chat surface (window.ChatPanel).
 *
 * Renders the centered conversation: empty-state greeting with example chips, a
 * modern composer (prompt + budget + model), user/agent bubbles, Gemini-style
 * inline collapsible "thinking", and clean digital-receipt cards.
 *
 * The reasoning steps are NOT in the /chat response — the server appends them to
 * the shared audit chain. So each turn is narrated by diffing AuditStore: capture
 * maxSeq() before the request, refresh() after, and narrate every block with a
 * higher seq. That same diff drives the Trust Center drawer.
 *
 * Offline (opened as a static file / server down), fetch fails and we fall back to
 * a local stub that mirrors src/server.js's stub path exactly — same purchase
 * regex, same amounts, same audit blocks (appended via AuditStore.appendDemo) —
 * so thinking, receipts and the Trust drawer stay coherent with no backend.
 */
(function () {
  'use strict';

  var S = window.AuditStore;

  var CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  var SEND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';
  var SPARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

  var EXAMPLES = [
    'Buy a mechanical keyboard under ₹8,000',
    'Order groceries for the week',
    'Compare two wireless earbuds',
    'What can you do?',
  ];

  var PURCHASE_INTENT_RE = /\b(buy|order|purchase|get me|checkout|book)\b/i;
  var DEFAULT_BUDGET = 10000; // mirrors server AUTO_APPROVE default (₹1,000,000 paise)

  // ─── tiny DOM factory ────────────────────────────────────────────────────
  function el(tag, className, props) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (props) {
      Object.keys(props).forEach(function (k) {
        if (k === 'html') node.innerHTML = props[k];
        else if (k === 'text') node.textContent = props[k];
        else if (k in node) node[k] = props[k];
        else node.setAttribute(k, props[k]);
      });
    }
    return node;
  }

  function formatTime(ts) {
    return new Date(ts || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // ─── offline stub — mirrors src/server.js POST /chat stub path ────────────
  function localStub(text, provider, budget) {
    var budgetRupees = Number.isFinite(budget) && budget > 0 ? budget : DEFAULT_BUDGET;
    var baseAgent = { event_type: 'AGENT_REASONING', actor: 'buyer_agent', session_id: null,
      payload: { provider: provider || 'stub', user_message: text, intent: 'chat' } };

    if (!PURCHASE_INTENT_RE.test(text)) {
      S.appendDemo([baseAgent]);
      return [{ role: 'agent', content: "Got it. Tell me what to find, compare, or buy and I'll take it from there. (model: demo)", timestamp: Date.now() }];
    }

    var subtotal = 2000 + Math.floor(Math.random() * 12000);
    var tax = Math.round(subtotal * 0.18);
    var total = subtotal + tax;
    var escalated = total > budgetRupees;
    var status = escalated ? 'pending_approval' : 'confirmed';
    var orderId = 'ORD-' + Math.floor(100000 + Math.random() * 900000);
    var itemName = text.length > 40 ? text.slice(0, 40).trim() + '…' : text || 'Requested item';
    var now = Date.now();

    var partials = [
      baseAgent,
      { event_type: 'AGENT_REASONING', actor: 'buyer_agent', session_id: orderId,
        payload: { step: 'search_catalog', note: 'Searching the catalog for "' + itemName + '".' } },
      { event_type: 'MANDATE_ISSUED', actor: 'buyer_agent', session_id: orderId,
        payload: { mandate: { mandate_type: 'IntentMandate', intent_id: 'int_' + now.toString(36),
          max_paise: budgetRupees * 100, allowed_categories: ['electronics', 'groceries', 'subscriptions'],
          created_at: new Date(now).toISOString(), expiry_timestamp: new Date(now + 30 * 60 * 1000).toISOString() } } },
      { event_type: 'AGENT_REASONING', actor: 'buyer_agent', session_id: orderId,
        payload: { step: 'create_cart', subtotal: subtotal, tax: tax, total: total } },
      escalated
        ? { event_type: 'GUARDRAIL_DECISION', actor: 'guardrail', session_id: orderId,
            payload: { decision: 'ESCALATE_TO_HUMAN', reason: 'amount_over_auto_approve', order_id: orderId, amount_rupees: total, threshold_rupees: budgetRupees } }
        : { event_type: 'MONEY_ACTION', actor: 'merchant_server', session_id: orderId,
            payload: { order_id: orderId, status: 'confirmed', currency: 'INR', amount_rupees: total, items: [{ name: itemName, price: subtotal }] } },
    ];
    var block = S.appendDemo(partials); // returns the terminal (money/guardrail) block

    return [
      { role: 'agent', timestamp: Date.now(),
        content: escalated
          ? 'That comes to ₹' + total.toLocaleString('en-IN') + ', above your ₹' + budgetRupees.toLocaleString('en-IN') + " budget — I've held it for your sign-off."
          : 'Found a good match and placed the order — receipt below.' },
      { role: 'receipt', timestamp: Date.now(),
        data: { status: status, merchantName: 'Marketplace via AP2', orderId: orderId,
          items: [{ name: itemName, price: subtotal }], subtotal: subtotal, tax: tax, total: total,
          refId: block.hash, timestamp: Date.now() } },
    ];
  }

  // ─── turn narration (shared by online + offline) ──────────────────────────
  function outcomeOf(entries) {
    for (var i = entries.length - 1; i >= 0; i--) {
      var t = entries[i].event_type;
      if (t === 'MONEY_ACTION') return { text: 'placed order', tone: 'trust' };
      if (t === 'GUARDRAIL_DECISION') return { text: 'held for approval', tone: 'pending' };
      if (t === 'WEBHOOK_RECEIVED') return { text: 'payment captured', tone: 'trust' };
      if (t === 'FAILURE') return { text: 'hit an error', tone: 'broken' };
    }
    return { text: 'replied', tone: 'neutral' };
  }

  window.ChatPanel = {
    init: function (region) {
      if (!region) return;
      region.innerHTML = '';
      var locked = false;

      // ── scaffold ───────────────────────────────────────────────────────
      var scroll = el('div', 'chat-scroll', { role: 'log', 'aria-live': 'polite' });

      var hero = el('div', 'hero');
      hero.appendChild(el('div', 'hero-badge', { html: S.icon('shield') + '<span>Razorpay Agent · ACP 2.0 + AP2</span>' }));
      hero.appendChild(el('h1', 'hero-title', { text: 'What would you like to buy today?' }));
      hero.appendChild(el('p', 'hero-sub', { text: 'Your buyer agent searches, checks it against your budget mandate, and settles on Razorpay rails — every step written to a tamper-evident audit chain.' }));
      var chips = el('div', 'hero-chips');
      EXAMPLES.forEach(function (ex) {
        var chip = el('button', 'hero-chip', { type: 'button', text: ex });
        chip.addEventListener('click', function () {
          if (locked) return;
          input.value = ex;
          autogrow();
          submit();
        });
        chips.appendChild(chip);
      });
      hero.appendChild(chips);
      scroll.appendChild(hero);

      // ── composer ───────────────────────────────────────────────────────
      var form = el('form', 'composer');
      var box = el('div', 'composer-box');
      var input = el('textarea', 'composer-input', {
        id: 'chat-input', rows: 1, placeholder: 'Message your buyer agent…', 'aria-label': 'Message your buyer agent',
      });
      var tools = el('div', 'composer-tools');

      var budgetField = el('label', 'composer-budget', { title: 'Spend cap — becomes the IntentMandate ceiling for a purchase' });
      budgetField.appendChild(el('span', 'composer-budget-sym', { text: '₹' }));
      var budgetInput = el('input', 'composer-budget-input', { id: 'budget-input', type: 'number', min: '0', step: '100', value: String(DEFAULT_BUDGET), 'aria-label': 'Budget in rupees' });
      budgetField.appendChild(budgetInput);

      var modelWrap = el('label', 'composer-model');
      var modelSelect = el('select', 'composer-model-select', { id: 'model-select', 'aria-label': 'Model' });
      // Labels match server routing: '' / 'stub' → offline stub; 'gemini' → Google;
      // any other value → Groq (so 'groq' is the correct value, fixing the old
      // mislabeled 'openai' option).
      [['stub', 'Demo (offline)'], ['gemini', 'Gemini'], ['groq', 'Groq']].forEach(function (o) {
        modelSelect.appendChild(el('option', '', { value: o[0], text: o[1] }));
      });
      modelWrap.appendChild(modelSelect);

      var send = el('button', 'composer-send', { type: 'submit', 'aria-label': 'Send', html: SEND });

      tools.appendChild(budgetField);
      tools.appendChild(modelWrap);
      tools.appendChild(el('span', 'composer-spacer'));
      tools.appendChild(send);
      box.appendChild(input);
      box.appendChild(tools);
      form.appendChild(box);
      form.appendChild(el('p', 'composer-hint', { html: 'Amounts stay under your budget mandate · settled on Razorpay test rails' }));

      region.appendChild(scroll);
      region.appendChild(form);

      // ── behaviors ────────────────────────────────────────────────────────
      function toBottom() { scroll.scrollTop = scroll.scrollHeight; }
      function autogrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      }
      function setLock(v) {
        locked = v;
        input.disabled = v; send.disabled = v; modelSelect.disabled = v; budgetInput.disabled = v;
        form.classList.toggle('is-locked', v);
        if (!v) { input.focus(); }
      }
      function dismissHero() {
        if (hero.parentNode) { hero.classList.add('is-gone'); window.setTimeout(function () { if (hero.parentNode) hero.remove(); }, 260); }
      }

      function addBubble(role, content, ts) {
        var row = el('div', 'msg msg-' + role);
        var bubble = el('div', 'bubble bubble-' + role);
        bubble.appendChild(el('div', 'bubble-text', { text: content || '' }));
        bubble.appendChild(el('div', 'bubble-time', { text: formatTime(ts) }));
        row.appendChild(bubble);
        scroll.appendChild(row);
        toBottom();
        return row;
      }

      function addReceipt(data, ts) {
        var d = data || {};
        var row = el('div', 'msg msg-agent');
        var card = el('div', 'receipt');
        card.appendChild(el('div', 'receipt-perf'));

        var head = el('div', 'receipt-head');
        var mh = el('div', 'receipt-merchant');
        mh.appendChild(el('div', 'receipt-merchant-name', { text: d.merchantName || 'Merchant' }));
        mh.appendChild(el('div', 'receipt-order', { text: 'Order ' + (d.orderId || '—') }));
        head.appendChild(mh);
        var statusMap = { confirmed: ['trust', 'Confirmed'], pending_approval: ['pending', 'Awaiting approval'], declined: ['broken', 'Declined'] };
        var sm = statusMap[d.status] || ['neutral', d.status || 'unknown'];
        head.appendChild(el('span', 'receipt-status tone-' + sm[0], { text: sm[1] }));
        card.appendChild(head);

        var lines = el('div', 'receipt-lines');
        (d.items || []).forEach(function (it) {
          var line = el('div', 'receipt-line');
          line.appendChild(el('span', 'receipt-line-name', { text: it.name || 'Item' }));
          line.appendChild(el('span', 'receipt-leader'));
          line.appendChild(el('span', 'receipt-line-price', { text: S.formatRupees(it.price) }));
          lines.appendChild(line);
        });
        card.appendChild(lines);

        var totals = el('div', 'receipt-totals');
        function trow(label, val, strong) {
          var r = el('div', 'receipt-trow' + (strong ? ' is-total' : ''));
          r.appendChild(el('span', '', { text: label }));
          r.appendChild(el('span', 'mono', { text: S.formatRupees(val) }));
          totals.appendChild(r);
        }
        trow('Subtotal', d.subtotal);
        trow('Tax (18%)', d.tax);
        trow('Total', d.total, true);
        card.appendChild(totals);

        var footer = el('div', 'receipt-footer');
        var ref = d.refId ? String(d.refId).slice(0, 8) : '00000000';
        var chip = el('button', 'chain-chip', { type: 'button', title: 'Open the Trust Center at this block' });
        chip.innerHTML = '<span class="chain-chip-check">' + CHECK + '</span>verified · chain ' + ref + '…';
        chip.addEventListener('click', function () {
          if (window.TrustDrawer) window.TrustDrawer.open(d.refId);
        });
        footer.appendChild(chip);
        footer.appendChild(el('span', 'receipt-time', { text: formatTime(d.timestamp || ts) }));
        card.appendChild(footer);

        row.appendChild(card);
        scroll.appendChild(row);
        toBottom();
      }

      // Live "thinking" placeholder → finalized collapsible disclosure.
      function addThinkingLive() {
        var row = el('div', 'msg msg-agent');
        var think = el('div', 'think is-live', { 'data-open': 'false' });
        var head = el('button', 'think-head', { type: 'button', 'aria-expanded': 'false' });
        head.innerHTML = '<span class="think-spark">' + SPARK + '</span><span class="think-headline shimmer">Thinking…</span>';
        think.appendChild(head);
        row.appendChild(think);
        scroll.appendChild(row);
        toBottom();
        return { row: row, think: think, head: head };
      }

      function finalizeThinking(ref, entries) {
        // A plain reply (only the opening reasoning block) gets no disclosure.
        if (!entries || entries.length <= 1) { ref.row.remove(); return; }
        var oc = outcomeOf(entries);
        ref.think.classList.remove('is-live');
        ref.head.innerHTML =
          '<span class="think-spark">' + SPARK + '</span>' +
          '<span class="think-headline">Thought for ' + entries.length + ' steps</span>' +
          '<span class="think-mid">·</span>' +
          '<span class="think-outcome tone-' + oc.tone + '">' + oc.text + '</span>' +
          '<span class="think-chev">' + CHEVRON + '</span>';

        var body = el('div', 'think-body');
        var inner = el('div', 'think-body-inner');
        var ol = el('ol', 'think-steps');
        entries.forEach(function (e, i) {
          var n = S.narrate(e);
          var li = el('li', 'think-step', { style: '--i:' + i });
          li.innerHTML =
            '<span class="think-node tone-' + n.tone + '">' + S.icon(n.icon) + '</span>' +
            '<span class="think-step-body">' +
              '<span class="think-step-title">' + n.title + '</span>' +
              (n.detail ? '<span class="think-step-detail mono">' + n.detail + '</span>' : '') +
            '</span>' +
            '<span class="think-step-time mono">' + formatTime(e.timestamp) + '</span>';
          ol.appendChild(li);
        });
        inner.appendChild(ol);
        body.appendChild(inner);
        ref.think.appendChild(body);

        ref.head.addEventListener('click', function () {
          var open = ref.think.getAttribute('data-open') === 'true';
          ref.think.setAttribute('data-open', String(!open));
          ref.head.setAttribute('aria-expanded', String(!open));
        });
      }

      // ── submit ───────────────────────────────────────────────────────────
      async function submit() {
        if (locked) return;
        var text = input.value.trim();
        if (!text) return;
        var provider = modelSelect.value;
        var budget = Number(budgetInput.value) || 0;

        dismissHero();
        addBubble('user', text, Date.now());
        input.value = '';
        autogrow();
        setLock(true);
        var thinking = addThinkingLive();

        // Ensure the store has its pre-turn state (guards the offline first-run
        // race where nothing has been polled yet), then anchor the seq diff.
        if (S.maxSeq() < 0) { try { await S.refresh(); } catch (e) { /* offline builds demo chain */ } }
        var baseline = S.maxSeq();

        var messages;
        try {
          var res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, provider: provider, budget: budget }),
          });
          if (!res.ok) throw new Error('chat HTTP ' + res.status);
          messages = await res.json();
          await S.refresh(); // pull the blocks the server just appended
        } catch (err) {
          // Offline / server down: mirror the server stub locally.
          messages = localStub(text, provider, budget);
        }

        var newEntries = S.entries().filter(function (e) { return e.seq > baseline; });
        finalizeThinking(thinking, newEntries);

        (Array.isArray(messages) ? messages : [messages]).forEach(function (m) {
          if (!m) return;
          if (m.role === 'receipt') addReceipt(m.data || m.receipt, m.timestamp);
          else addBubble(m.role || 'agent', m.content || m.message, m.timestamp);
        });

        setLock(false);
      }

      form.addEventListener('submit', function (e) { e.preventDefault(); submit(); });
      input.addEventListener('input', autogrow);
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
      });

      input.focus();
    },
  };
})();

</script>
  <script>
/**
 * trust.js — the Trust Center slide-over drawer (window.TrustDrawer).
 *
 * Replaces the old inspector.js + hashchain.js panels with one polished,
 * click-to-reveal surface. Subscribes to AuditStore (the single poller) and
 * renders four sections against the live chain:
 *   1. Integrity  — pass/fail status, Verify button (idle→verifying→valid/invalid),
 *                   and a "Simulate tampering" switch that breaks the last block.
 *   2. Mandate    — budget-utilization meter, expiry countdown, mandate JSON.
 *   3. Activity   — narrated event timeline (the FEED_TYPES subset), new rows animate in.
 *   4. Hash chain — block cards on a connector spine, expandable payloads, verify tones.
 *
 * open(highlightHash) scrolls to + pulses the matching block (the receipt chip
 * deep-links here via the block's real hash); the header button opens it plainly.
 *
 * Accessibility: role="dialog" aria-modal, ESC + backdrop close, focus moved in on
 * open and restored on close, and a lightweight Tab focus trap.
 */
(function () {
  'use strict';

  var S = window.AuditStore;

  var IX = {
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    loader: '<svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
    bug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="14" x="8" y="6" rx="4"/><path d="m19 7-3 2M5 7l3 2M19 19l-3-2M5 19l3-2M20 13h-4M4 13h4M10 4l1 2M14 4l-1 2"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    activity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
    chain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><path d="M8 12h8"/></svg>',
  };

  function el(tag, className, props) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (props) Object.keys(props).forEach(function (k) {
      if (k === 'html') node.innerHTML = props[k];
      else if (k === 'text') node.textContent = props[k];
      else if (k in node) node[k] = props[k];
      else node.setAttribute(k, props[k]);
    });
    return node;
  }

  function fmtDuration(ms) {
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    function p(n) { return String(n).padStart(2, '0'); }
    return p(h) + ':' + p(m) + ':' + p(sec);
  }
  function fmtStamp(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso || '');
    function p(n) { return String(n).padStart(2, '0'); }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }
  function fmtTime(iso) {
    return new Date(iso || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Theme-aware JSON viewer (DOM nodes, so payload strings can't inject markup).
  function renderJson(value, container) {
    var t = typeof value;
    if (value === null) { container.appendChild(el('span', 'json-null', { text: 'null' })); return; }
    if (t === 'boolean') { container.appendChild(el('span', 'json-boolean', { text: String(value) })); return; }
    if (t === 'number') { container.appendChild(el('span', 'json-number', { text: String(value) })); return; }
    if (t === 'string') { container.appendChild(el('span', 'json-string', { text: '"' + value + '"' })); return; }
    if (Array.isArray(value)) {
      if (!value.length) { container.appendChild(document.createTextNode('[]')); return; }
      container.appendChild(document.createTextNode('[ '));
      value.forEach(function (item, i) { renderJson(item, container); if (i < value.length - 1) container.appendChild(document.createTextNode(', ')); });
      container.appendChild(document.createTextNode(' ]'));
      return;
    }
    var ul = el('ul', 'json-object');
    var keys = Object.keys(value);
    keys.forEach(function (key, i) {
      var li = el('li');
      li.appendChild(el('span', 'json-key', { text: '"' + key + '": ' }));
      renderJson(value[key], li);
      if (i < keys.length - 1) li.appendChild(document.createTextNode(','));
      ul.appendChild(li);
    });
    container.appendChild(ul);
  }

  window.TrustDrawer = {
    init: function (opts) {
      var drawer = opts.drawer;
      var backdrop = opts.backdrop;
      var openBtn = opts.openBtn;
      if (!drawer || !backdrop) return;

      // ── interactive state (survives store re-renders) ────────────────────
      var isOpen = false;
      var lastFocused = null;
      var verifyState = 'idle'; // idle | verifying | valid | invalid
      var brokenAt = null;
      var tampering = false;
      var lastVerified = null;
      var expandedSeqs = new Set();
      var renderedActivity = new Set();
      var chainSig = '';        // block-count/tamper signature to avoid needless re-render

      // derived
      var entries = [];
      var offline = false;
      var expiryMs = null;

      // ── scaffold ─────────────────────────────────────────────────────────
      drawer.innerHTML = '';
      var head = el('div', 'drawer-head');
      var titles = el('div', 'drawer-head-titles');
      titles.appendChild(el('div', 'drawer-eyebrow', { html: S.icon('shield') + '<span>Trust Center</span>' }));
      titles.appendChild(el('h2', 'drawer-title', { id: 'trust-title', text: 'Verifiable by design' }));
      var connChip = el('span', 'drawer-conn');
      titles.appendChild(connChip);
      head.appendChild(titles);
      var closeBtn = el('button', 'drawer-close', { type: 'button', 'aria-label': 'Close Trust Center', html: IX.x });
      head.appendChild(closeBtn);
      drawer.appendChild(head);

      var scroll = el('div', 'drawer-scroll');
      drawer.appendChild(scroll);

      function section(iconHtml, title) {
        var sec = el('section', 'tc-section');
        var h = el('div', 'tc-section-head', { html: '<span class="tc-section-icon">' + iconHtml + '</span><span>' + title + '</span>' });
        sec.appendChild(h);
        var body = el('div', 'tc-section-body');
        sec.appendChild(body);
        scroll.appendChild(sec);
        return body;
      }

      // 1 · Integrity
      var integrityBody = section(S.icon('shieldCheck'), 'Integrity');
      var integrityCard = el('div', 'integrity-card');
      var integrityStatus = el('div', 'integrity-status');
      var verifyBtn = el('button', 'verify-btn', { type: 'button' });
      var verifyStatus = el('p', 'verify-status');
      var tamperLabel = el('label', 'tamper-toggle');
      var tamperCb = el('input', '', { type: 'checkbox' });
      tamperLabel.appendChild(tamperCb);
      tamperLabel.appendChild(el('span', 'tamper-track', { html: '<span class="tamper-thumb"></span>' }));
      tamperLabel.appendChild(el('span', 'tamper-text', { html: IX.bug + ' Simulate tampering' }));
      integrityCard.appendChild(integrityStatus);
      integrityCard.appendChild(verifyBtn);
      integrityCard.appendChild(verifyStatus);
      integrityCard.appendChild(tamperLabel);
      integrityBody.appendChild(integrityCard);

      // 2 · Mandate
      var mandateBody = section(S.icon('shield'), 'Intent Mandate');
      var meter = el('div', 'meter');
      var meterLabels = el('div', 'meter-labels', { html: '<span>Budget utilization</span><span class="meter-text mono">—</span>' });
      var meterTrack = el('div', 'meter-track');
      var meterFill = el('div', 'meter-fill');
      meterTrack.appendChild(meterFill);
      meter.appendChild(meterLabels);
      meter.appendChild(meterTrack);
      mandateBody.appendChild(meter);
      var expiryRow = el('div', 'expiry-row', { html: '<span class="expiry-label">' + IX.clock + ' Expires in</span><span class="expiry-time mono">—</span>' });
      mandateBody.appendChild(expiryRow);
      var mandateJson = el('div', 'json-viewer');
      mandateJson.appendChild(el('span', 'json-empty', { text: 'No active intent mandate yet — ask the agent to buy something.' }));
      mandateBody.appendChild(mandateJson);
      var meterText = meterLabels.querySelector('.meter-text');
      var expiryTime = expiryRow.querySelector('.expiry-time');

      // 3 · Activity
      var activityBody = section(IX.activity, 'Activity');
      var activityList = el('ol', 'activity-list');
      var activityEmpty = el('div', 'tc-empty', { text: 'No transaction events yet.' });
      activityBody.appendChild(activityEmpty);
      activityBody.appendChild(activityList);

      // 4 · Hash chain
      var chainBody = section(IX.chain, 'Hash chain');
      var chainList = el('ol', 'chain-list');
      chainBody.appendChild(chainList);

      // ── rendering ─────────────────────────────────────────────────────────
      function recomputeMandate() {
        var activeMandate = null, mandateSeq = -1;
        entries.forEach(function (e) {
          if (e.event_type === 'MANDATE_ISSUED' && e.payload && e.payload.mandate) {
            activeMandate = e.payload.mandate; mandateSeq = e.seq;
          }
        });
        var maxPaise = activeMandate && typeof activeMandate.max_paise === 'number' ? activeMandate.max_paise : null;
        expiryMs = activeMandate && activeMandate.expiry_timestamp ? Date.parse(activeMandate.expiry_timestamp) : null;

        // Spend = distinct money moved at/after the active mandate.
        var spentPaise = 0; var seen = new Set();
        entries.forEach(function (e) {
          if (e.event_type !== 'MONEY_ACTION') return;
          if (mandateSeq >= 0 && e.seq < mandateSeq) return;
          var p = e.payload || {};
          var ref = p.order_id || p.razorpay_order_id || p.id || e.seq;
          if (seen.has(ref)) return; seen.add(ref);
          var paise = S.amountPaiseOf(p);
          if (paise) spentPaise += paise;
        });

        // Meter
        if (maxPaise == null) {
          meterText.textContent = spentPaise > 0 ? S.formatPaise(spentPaise) + ' spent' : '—';
          meterFill.style.width = '0%';
          meterFill.style.background = 'var(--text-3)';
        } else {
          var pct = Math.min(100, Math.max(0, (spentPaise / maxPaise) * 100));
          meterFill.style.width = pct + '%';
          meterText.textContent = S.formatPaise(spentPaise) + ' / ' + S.formatPaise(maxPaise);
          meterFill.style.background = pct < 70 ? 'var(--trust)' : (pct < 90 ? 'var(--pending)' : 'var(--broken)');
        }

        // Mandate JSON
        mandateJson.innerHTML = '';
        if (activeMandate) renderJson(activeMandate, mandateJson);
        else mandateJson.appendChild(el('span', 'json-empty', { text: 'No active intent mandate yet — ask the agent to buy something.' }));
      }

      function tickExpiry() {
        if (expiryMs == null) { expiryTime.textContent = '—'; expiryTime.style.color = 'var(--text-3)'; return; }
        var rem = expiryMs - Date.now();
        if (rem <= 0) { expiryTime.textContent = 'Expired'; expiryTime.style.color = 'var(--broken)'; }
        else { expiryTime.textContent = fmtDuration(rem); expiryTime.style.color = rem > 10 * 60 * 1000 ? 'var(--trust)' : 'var(--pending)'; }
      }

      function syncActivity() {
        var feed = entries.filter(function (e) { return S.FEED_TYPES.has(e.event_type); });
        activityEmpty.style.display = feed.length ? 'none' : 'block';
        feed.forEach(function (e) {
          if (renderedActivity.has(e.seq)) return;
          renderedActivity.add(e.seq);
          var n = S.narrate(e);
          var v = S.feedView(e);
          var li = el('li', 'activity-item enter');
          var amount = v.amountPaise != null ? S.formatPaise(v.amountPaise) : '';
          var id = S.idOf(e);
          li.innerHTML =
            '<span class="activity-node tone-' + n.tone + '">' + S.icon(n.icon) + '</span>' +
            '<span class="activity-main">' +
              '<span class="activity-title">' + n.title + '</span>' +
              '<span class="activity-meta">' + (id ? '<span class="mono">' + id + '</span>' : '') + '<span class="activity-time">' + fmtTime(e.timestamp) + '</span></span>' +
            '</span>' +
            (amount ? '<span class="activity-amount mono">' + amount + '</span>' : '');
          activityList.appendChild(li);
          // Clear the entrance class after it plays so re-layout doesn't replay it.
          window.setTimeout(function () { li.classList.remove('enter'); }, 500);
        });
      }

      function toneForIndex(index) {
        if (verifyState === 'valid') return 'ok';
        if (verifyState === 'invalid' && brokenAt !== null) {
          if (index === brokenAt) return 'broken';
          if (index > brokenAt) return 'suspect';
          return 'ok';
        }
        return 'idle';
      }

      function renderChain() {
        var sig = entries.length + '|' + verifyState + '|' + brokenAt + '|' + tampering + '|' + Array.from(expandedSeqs).sort().join(',');
        if (sig === chainSig) return;
        chainSig = sig;
        chainList.innerHTML = '';
        entries.forEach(function (block, index) {
          var li = el('li', 'chain-item');
          if (index > 0) {
            var tone = toneForIndex(index);
            var broken = tone === 'broken' || tone === 'suspect';
            var connector = el('div', 'chain-connector tone-' + tone, { html: S.icon(broken ? 'unlink' : 'link') + '<span class="chain-line"></span>' });
            li.appendChild(connector);
          }
          var blockTone = toneForIndex(index);
          var card = el('div', 'chain-block tone-' + blockTone, { 'data-hash': block.hash || '' });

          var bhead = el('div', 'chain-block-head');
          bhead.innerHTML =
            '<span class="chain-seq mono">#' + String(block.seq).padStart(4, '0') + '</span>' +
            '<span class="chain-event">' + block.event_type + '</span>' +
            '<span class="chain-block-time mono">' + fmtStamp(block.timestamp) + '</span>';
          if (blockTone === 'broken' || blockTone === 'suspect') bhead.appendChild(el('span', 'chain-flag', { text: 'unverifiable' }));
          card.appendChild(bhead);

          // Tamper view corrupts the last block's displayed hash (client-only).
          var displayHash = block.hash;
          var tamperedView = false;
          if (tampering && index === entries.length - 1 && entries.length > 0) {
            displayHash = 'deadbeef' + String(block.hash || '').slice(8);
            tamperedView = true;
          }
          var hashes = el('div', 'chain-hashes mono');
          var prevStr = index === 0 ? 'GENESIS' : S.truncateHash(block.prev_hash);
          hashes.innerHTML =
            '<span class="chain-hash-row">hash <span class="hash-val ' + (tamperedView ? 'is-bad' : 'is-hash') + '">' + S.truncateHash(displayHash) + '</span></span>' +
            '<span class="chain-hash-row">prev <span class="hash-val is-prev">' + prevStr + '</span></span>';
          card.appendChild(hashes);

          var toggle = el('button', 'chain-toggle', { type: 'button' });
          var expanded = expandedSeqs.has(block.seq);
          toggle.textContent = (expanded ? '▾' : '▸') + ' payload';
          var payload = el('div', 'chain-payload');
          if (expanded) {
            var jv = el('div', 'json-viewer');
            renderJson(block.payload, jv);
            payload.appendChild(jv);
          } else {
            payload.style.display = 'none';
          }
          toggle.addEventListener('click', function () {
            if (expandedSeqs.has(block.seq)) expandedSeqs.delete(block.seq);
            else expandedSeqs.add(block.seq);
            renderChain();
          });
          card.appendChild(toggle);
          card.appendChild(payload);

          li.appendChild(card);
          chainList.appendChild(li);
        });
      }

      function renderIntegrity() {
        var integ = S.integrity();
        verifyBtn.className = 'verify-btn state-' + verifyState;
        if (verifyState === 'idle') {
          verifyBtn.innerHTML = S.icon('shieldQuestion') + '<span>Verify chain integrity</span>';
          var passive = integ.valid !== false;
          integrityStatus.className = 'integrity-status tone-' + (passive ? 'trust' : 'broken');
          integrityStatus.innerHTML = (passive ? S.icon('shieldCheck') : S.icon('shieldAlert')) +
            '<span><b>' + (passive ? 'Chain intact' : 'Integrity violation') + '</b><small>' + entries.length + ' blocks · SHA-256 hash-linked' + (offline ? ' · demo data' : '') + '</small></span>';
          verifyStatus.textContent = lastVerified ? 'Last verified at ' + fmtStamp(lastVerified) + '.' : 'Not yet verified in this session.';
        } else if (verifyState === 'verifying') {
          verifyBtn.innerHTML = IX.loader + '<span>Verifying chain…</span>';
          integrityStatus.className = 'integrity-status tone-neutral';
          integrityStatus.innerHTML = IX.loader + '<span><b>Recomputing linkage…</b><small>Walking ' + entries.length + ' blocks</small></span>';
          verifyStatus.textContent = 'Recomputing hash linkage across the chain…';
        } else if (verifyState === 'valid') {
          verifyBtn.innerHTML = S.icon('shieldCheck') + '<span>Chain intact — ' + entries.length + ' blocks verified</span>';
          integrityStatus.className = 'integrity-status tone-trust';
          integrityStatus.innerHTML = S.icon('shieldCheck') + '<span><b>Chain intact</b><small>All ' + entries.length + ' blocks verified</small></span>';
          verifyStatus.textContent = 'All ' + entries.length + ' blocks verified at ' + fmtStamp(lastVerified) + '.';
        } else if (verifyState === 'invalid') {
          verifyBtn.innerHTML = S.icon('shieldAlert') + '<span>Integrity violation — block #' + (brokenAt != null ? brokenAt : '?') + '</span>';
          integrityStatus.className = 'integrity-status tone-broken';
          integrityStatus.innerHTML = S.icon('shieldAlert') + '<span><b>Integrity violation</b><small>Broken link at block #' + (brokenAt != null ? brokenAt : '?') + '</small></span>';
          verifyStatus.textContent = brokenAt != null && brokenAt >= 0
            ? 'prev_hash at block #' + brokenAt + " doesn't match hash at block #" + (brokenAt - 1) + '.'
            : 'Chain verification failed.';
        }
      }

      function renderConn() {
        connChip.className = 'drawer-conn ' + (offline ? 'is-demo' : 'is-live');
        connChip.innerHTML = '<span class="conn-dot"></span>' + (offline ? 'Demo data' : 'Live');
      }

      // ── verify controls ────────────────────────────────────────────────────
      async function onVerify() {
        if (verifyState === 'verifying') return;
        verifyState = 'verifying'; brokenAt = null; renderIntegrity();
        if (tampering) {
          window.setTimeout(function () {
            verifyState = 'invalid';
            brokenAt = entries.length > 1 ? entries.length - 1 : 0;
            lastVerified = new Date().toISOString();
            renderIntegrity(); chainSig = ''; renderChain();
          }, 800);
          return;
        }
        var result = await S.verify();
        lastVerified = new Date().toISOString();
        if (result.valid) { verifyState = 'valid'; brokenAt = null; }
        else { verifyState = 'invalid'; brokenAt = result.brokenAt; }
        renderIntegrity(); chainSig = ''; renderChain();
      }
      verifyBtn.addEventListener('click', onVerify);
      tamperCb.addEventListener('change', function (e) {
        tampering = e.target.checked;
        verifyState = 'idle'; brokenAt = null;
        renderIntegrity(); chainSig = ''; renderChain();
      });

      // ── store subscription ──────────────────────────────────────────────────
      S.subscribe(function (snap) {
        entries = snap.entries;
        offline = snap.offline;
        // New blocks invalidate a prior pass/fail verdict (matches the old panel).
        if (verifyState === 'valid' || verifyState === 'invalid') { verifyState = 'idle'; brokenAt = null; }
        recomputeMandate();
        tickExpiry();
        syncActivity();
        renderChain();
        renderIntegrity();
        renderConn();
      });

      // Expiry ticks every second, independent of the poll cadence.
      window.setInterval(tickExpiry, 1000);

      // ── open / close ─────────────────────────────────────────────────────────
      function focusables() {
        return Array.prototype.slice.call(drawer.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
          .filter(function (n) { return !n.disabled && n.offsetParent !== null; });
      }
      function onKeydown(e) {
        if (e.key === 'Escape') { close(); return; }
        if (e.key === 'Tab') {
          var f = focusables();
          if (!f.length) return;
          var first = f[0], last = f[f.length - 1];
          if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
          else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      }

      function open(highlightHash) {
        if (!isOpen) {
          lastFocused = document.activeElement;
          isOpen = true;
          backdrop.hidden = false;
          drawer.setAttribute('aria-hidden', 'false');
          // next frame → CSS transition in
          requestAnimationFrame(function () {
            backdrop.classList.add('is-open');
            drawer.classList.add('is-open');
            document.body.classList.add('drawer-open');
          });
          document.addEventListener('keydown', onKeydown);
          closeBtn.focus();
        }
        if (highlightHash) highlight(highlightHash);
      }

      function close() {
        if (!isOpen) return;
        isOpen = false;
        backdrop.classList.remove('is-open');
        drawer.classList.remove('is-open');
        document.body.classList.remove('drawer-open');
        drawer.setAttribute('aria-hidden', 'true');
        document.removeEventListener('keydown', onKeydown);
        window.setTimeout(function () { if (!isOpen) backdrop.hidden = true; }, 320);
        if (lastFocused && lastFocused.focus) lastFocused.focus();
      }

      function highlight(hash) {
        // Expand + scroll to + pulse the block whose hash matches the receipt refId.
        var idx = entries.findIndex(function (e) { return e.hash === hash; });
        if (idx < 0) return;
        expandedSeqs.add(entries[idx].seq);
        chainSig = ''; renderChain();
        window.requestAnimationFrame(function () {
          var card = chainList.querySelector('.chain-block[data-hash="' + hash + '"]');
          if (!card) return;
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.classList.remove('pulse');
          // reflow to restart the animation, then pulse
          void card.offsetWidth;
          card.classList.add('pulse');
          window.setTimeout(function () { card.classList.remove('pulse'); }, 1600);
        });
      }

      closeBtn.addEventListener('click', close);
      backdrop.addEventListener('click', close);
      if (openBtn) openBtn.addEventListener('click', function () { open(); });

      // expose
      this.open = open;
      this.close = close;
    },
  };
})();

</script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      window.Theme.init(document.getElementById('theme-toggle'));
      window.AuditStore.start(1500);
      window.ChatPanel.init(document.getElementById('chat-region'));
      window.TrustDrawer.init({
        drawer: document.getElementById('trust-drawer'),
        backdrop: document.getElementById('trust-backdrop'),
        openBtn: document.getElementById('trust-btn'),
      });
    });
  </script>
